[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse-data-pipeline"
version = "0.1.0"
description = "Open-source lakehouse data engineering pipeline"
requires-python = ">=3.12"
dependencies = [
    "dlt[filesystem]>=1.28",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pre-commit>=4.0",
    "dlt[duckdb]>=1.28",
    # Version-matched to the spark-iceberg container's bundled Spark (3.5.5).
    # Host-side only, for mypy/import-resolution — jobs always execute
    # in-container via the image's own bundled PySpark, not this install.
    # (boto3 is deliberately NOT added here: it's only used inside the
    # container, where it's installed separately via docker/spark/Dockerfile;
    # a host install conflicts with dlt's pinned aiobotocore/botocore range,
    # so mypy gets an ignore_missing_imports override for it instead below.)
    "pyspark==3.5.5",
    # NOT the [spark] extra: it pulls a pinned typing-extensions that breaks
    # import (see great-expectations/great_expectations#11090). Unneeded
    # anyway since pyspark is already present wherever this runs.
    "great_expectations>=1.19",
    # For testing lakehouse.orchestration.docker_exec. No botocore dependency
    # at all, so unlike boto3 it doesn't conflict with dlt's pinned
    # aiobotocore/botocore range on the host.
    "docker>=7.1,<8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# These jobs run inside the spark-iceberg container on its bundled Python
# 3.10 (older than this project's own 3.12), where `datetime.UTC` doesn't
# exist — `timezone.utc` is used instead, which UP017 would otherwise "fix"
# to the newer (here, unavailable) alias.
"src/lakehouse/processing/*.py" = ["UP017"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# boto3 is only installed inside the spark-iceberg container (see
# pyproject.toml's dev deps comment above for why it's not on the host).
[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

# great_expectations ships types but doesn't explicitly re-export its
# expectation classes (e.g. gx.expectations.ExpectColumnValuesToNotBeNull),
# which --no-implicit-reexport (part of strict = true) flags as attr-defined
# errors. Not a missing-stubs issue, so ignore_missing_imports wouldn't help.
[[tool.mypy.overrides]]
module = "great_expectations.*"
implicit_reexport = true

# The docker SDK ships no py.typed marker, but mypy still finds and analyzes
# its real (untyped) source rather than treating it as missing — so
# ignore_missing_imports (for imports that can't be found at all) doesn't
# apply; follow_imports = "skip" tells mypy not to analyze that source and
# treat it as Any instead.
[[tool.mypy.overrides]]
module = "docker.*"
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
