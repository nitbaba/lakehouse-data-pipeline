networks:
  lakehouse-net:
    driver: bridge

volumes:
  postgres_data:
  airflow_logs:
  airflow_plugins:
  superset_home:

x-airflow-common: &airflow-common
  build:
    context: ./docker/airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  volumes:
    - ./dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - airflow_plugins:/opt/airflow/plugins
  networks:
    - lakehouse-net
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MULTIPLE_DATABASES: iceberg_catalog,superset
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lakehouse-net

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    # The image's default user (uid 1000) can't read the root-owned
    # ~/.aws mount below, which silently never mattered until a real
    # table commit needed the REST catalog server's own S3 credentials
    # (namespace-only operations don't touch S3). Run as root instead,
    # matching spark-iceberg's default user, which already reads this
    # same mount fine.
    user: root
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg_catalog
      CATALOG_JDBC_USER: ${POSTGRES_USER}
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
      CATALOG_WAREHOUSE: s3://${LAKEHOUSE_BUCKET_NAME}/warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      AWS_REGION: ${AWS_REGION}
      AWS_PROFILE: ${AWS_PROFILE}
      HOME: /root
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    ports:
      - "8181:8181"
    networks:
      - lakehouse-net

  spark-iceberg:
    build:
      context: ./docker/spark
    depends_on:
      - iceberg-rest
    environment:
      AWS_REGION: ${AWS_REGION}
      AWS_PROFILE: ${AWS_PROFILE}
      HOME: /root
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      LAKEHOUSE_BUCKET_NAME: ${LAKEHOUSE_BUCKET_NAME}
      PYTHONPATH: /home/iceberg/src
    # The image's default `notebook` command hardcodes --NotebookApp.token=''
    # (no auth). Override it with a real token, keeping the same cluster
    # startup behavior from the image's entrypoint.sh.
    command:
      - |
        export PYSPARK_DRIVER_PYTHON=jupyter-notebook
        export PYSPARK_DRIVER_PYTHON_OPTS="--notebook-dir=/home/iceberg/notebooks --ip=0.0.0.0 --NotebookApp.token=$$JUPYTER_TOKEN --port=8888 --no-browser --allow-root"
        pyspark
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
      - ./notebooks:/home/iceberg/notebooks/lakehouse
      - ./docker/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./src:/home/iceberg/src:ro
    ports:
      - "8888:8888"
      - "8082:8080"
    networks:
      - lakehouse-net

  trino:
    image: trinodb/trino:483
    # Same root-owned ~/.aws mount issue already hit and fixed for
    # iceberg-rest: the image's default non-root user can't read it.
    user: root
    depends_on:
      - iceberg-rest
    environment:
      AWS_REGION: ${AWS_REGION}
      AWS_PROFILE: ${AWS_PROFILE}
      HOME: /root
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
      - ./docker/trino/catalog:/etc/trino/catalog:ro
    # Host 8080 is occupied by an unrelated process on this shared dev
    # machine (not part of this project's stack) -- map to 8083 instead.
    # Trino's own default port (8080) is unaffected inside the container.
    ports:
      - "8083:8080"
    networks:
      - lakehouse-net

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate &&
      airflow users create
      --username ${AIRFLOW_ADMIN_USERNAME}
      --password ${AIRFLOW_ADMIN_PASSWORD}
      --firstname ${AIRFLOW_ADMIN_FIRSTNAME}
      --lastname ${AIRFLOW_ADMIN_LASTNAME}
      --role Admin
      --email ${AIRFLOW_ADMIN_EMAIL} &&
      (airflow connections add 'aws_lakehouse'
      --conn-type 'aws'
      --conn-extra '{\"profile_name\": \"${AWS_PROFILE}\", \"region_name\": \"${AWS_REGION}\"}'
      || true)"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    # Needed to read the docker socket below (mounted root-owned) so the
    # DockerExecOperator can reach the spark-iceberg container -- the
    # default non-root `airflow` user can't. Same class of fix already
    # applied to iceberg-rest in Phase 3 for an analogous root-owned mount.
    # Scoped to the scheduler only (the service that actually executes
    # LocalExecutor tasks), not the webserver.
    user: root
    environment:
      <<: *airflow-common-env
      HOME: /root
      AWS_REGION: ${AWS_REGION}
      AWS_PROFILE: ${AWS_PROFILE}
      LAKEHOUSE_BUCKET_NAME: ${LAKEHOUSE_BUCKET_NAME}
      PYTHONPATH: /opt/airflow/src
      # dbt's own build artifacts can't be written into ./dbt itself, which
      # is mounted read-only below -- redirect them outside the bind mount
      # so they never leak into the host git working tree.
      DBT_TARGET_PATH: /tmp/dbt_target
      DBT_LOG_PATH: /tmp/dbt_logs
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - ./src:/opt/airflow/src:ro
      - ./dbt:/opt/airflow/dbt:ro
      - ${HOME}/.aws:/root/.aws:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  superset-init:
    build:
      context: ./docker/superset
    environment: &superset-common-env
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_DB: superset
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      bash -c "superset db upgrade &&
      superset fab create-admin
      --username ${SUPERSET_ADMIN_USERNAME}
      --password ${SUPERSET_ADMIN_PASSWORD}
      --firstname ${SUPERSET_ADMIN_FIRSTNAME}
      --lastname ${SUPERSET_ADMIN_LASTNAME}
      --email ${SUPERSET_ADMIN_EMAIL} &&
      superset init"
    volumes:
      - superset_home:/app/superset_home
    networks:
      - lakehouse-net
    depends_on:
      postgres:
        condition: service_healthy

  superset:
    build:
      context: ./docker/superset
    environment:
      <<: *superset-common-env
    volumes:
      - superset_home:/app/superset_home
    ports:
      - "8088:8088"
    networks:
      - lakehouse-net
    depends_on:
      superset-init:
        condition: service_completed_successfully
