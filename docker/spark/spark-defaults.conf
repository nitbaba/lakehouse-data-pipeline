# Iceberg REST catalog + real S3 wiring (replaces the bundled quickstart's MinIO defaults).
spark.sql.extensions                        org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.rest                      org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.rest.type                 rest
spark.sql.catalog.rest.uri                  http://iceberg-rest:8181
spark.sql.catalog.rest.warehouse            s3://lakehouse-dev-334455666973/warehouse/
spark.sql.catalog.rest.io-impl              org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.rest.s3.region            us-east-1
spark.sql.defaultCatalog                    rest

# Hadoop S3A wiring for generic `s3a://` file reads (e.g. raw landing-zone
# JSON for Bronze) — a separate code path from Iceberg's own S3FileIO above.
# AWS SDK v1 (used by hadoop-aws) cannot resolve our assumable-role profile
# on its own — both ProfileCredentialsProvider (reads ~/.aws/credentials
# only) and the Hadoop-native AssumedRoleCredentialProvider chain still
# resolve the base/nested profile name from the process-wide AWS_PROFILE
# env var, which points at the role profile itself (only defined in
# ~/.aws/config) — confirmed via smoke test ("No AWS profile named
# 'lakehouse-pipeline'") in both configurations. So instead: job code
# (see spark_session.py) uses boto3 — which resolves this profile
# correctly — to assume the role itself and hands Spark ready-made
# temporary credentials via TemporaryAWSCredentialsProvider.
spark.hadoop.fs.s3a.aws.credentials.provider   org.apache.hadoop.fs.s3a.TemporaryAWSCredentialsProvider
spark.hadoop.fs.s3a.endpoint.region            us-east-1
