name: Lint and Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Explicitly pinned to match the Java 17 already proven to work with
      # tests/conftest.py's local PySpark fixture — not relying on
      # ubuntu-latest's default JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src tests

      - name: Pytest
        run: pytest -q
